<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="images/Logo.png" type="image/icon type" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Acme&family=Jost:ital,wght@0,100..900;1,100..900&family=Orbitron:wght@400..900&family=Playfair+Display&display=swap"
      rel="stylesheet"
    />
    <link rel="preload" href="images/hero2.png" as="image" />

    <title>Game Haven St. George</title>
  </head>
  <body>
    <div id="app">
      <div id="main" :style="backgroundStyle">
        <!-- Mobile Menu Button -->
        <button class="menu-btn" @click="toggleMenu">
          <div></div>
          <div></div>
          <div></div>
        </button>

        <!-- Navigation -->
        <nav :class="{ 'mobile-nav': menuOpen }">
          <a href="index.html" id="nav-logo-link">
            <img src="images/Logo.png" id="nav-logo" />
          </a>
          <ul>
            <li><a href="#" @click="navigatePage('home')">Home</a></li>
            <li class="dropdown">
              <a href="#" @click="toggleDropdown('tcg')">TCG</a>
              <ul v-if="dropdowns.tcg" class="submenu">
                <li>
                  <a href="#" @click="navigatePage('tcg-pokemon')">Pokémon</a>
                </li>
                <li>
                  <a href="#" @click="navigatePage('tcg-mtg')"
                    >Magic: The Gathering</a
                  >
                </li>
              </ul>
            </li>
            <li><a href="#" @click="navigatePage('games')">Games</a></li>
            <li><a href="#" @click="navigatePage('events')">Events</a></li>
            <li><a href="#" @click="navigatePage('rentals')">Rentals</a></li>
            <li><a href="#" @click="navigatePage('contact')">Contact</a></li>
          </ul>
        </nav>

        <div v-if="currentPage == 'home'" class="home-content">
          <div class="home-logo">
            <img src="images/Text.png" id="logo-png" />
            <p class="home-address">250 Red Cliffs Dr #32</p>
          </div>

          <div class="reviews">
            <div class="review">
              <img src="images/stars.png" class="stars" />
              <p>

                of board games, miniature games, GREAT hobby section and tons
                more! Definitely recommended.
              </p>
            </div>
            <div class="review">
              <img src="images/stars.png" class="stars" />
              <p>
                Game Haven is a great store for all of your tabletop needs. The
                staff are wonderful as well. Ben and Jayden took great care of

                look forward to coming back soon!
              </p>
            </div>
            <div class="review">
              <img src="images/stars.png" class="stars" />
              <p>
                Staff is very knowledgeable. Best feature was the ability to

                spectacular and we definitely rented a bunch before purchasing.
                Great asset to the St. George community.
              </p>
            </div>
          </div> -->

          <!-- <img src="images/hero.png" height="500px" /> -->
        </div>

        <div v-if="currentPage == 'tcg'" class="home-content"></div>
        <div v-if="currentPage == 'games'" class="home-content"></div>
        <div v-if="currentPage == 'events'" class="events-content">
          <div class="upcoming-events">
            <h1>Upcoming Events</h1>
          </div>
          <div class="events-wrapper">
            <div class="event">
              <p>event</p>
            </div>
          </div>
        </div>
        <div v-if="currentPage == 'rentals'" class="home-content"></div>
        <div v-if="currentPage == 'contact'" class="contact-content">
          <div class="contact-bubbles">
            <div class="circle left">
              <p>Left Content</p>
            </div>
            <div class="circle center"></div>
            <div class="circle right">
              <p>Right Content</p>
            </div>
          </div>
        </div>
      </div>
      <div class="footer">
        <div class="times">
          <div id="open">Monday – Saturday: 10 AM – 10 PM</div>
          <div id="closed">Sunday: Closed</div>
        </div>
        <div class="copyright">Copyright © 2025 Game Haven St. George</div>
        <div class="social">
          <a
            href="https://discord.gg/GkBxQasQ"
            class="icon-link"
            target="_blank"
            rel="noopener noreferrer"
            title="https://discord.gg/GkBxQasQ"
          >
            <img src="images/discord-white-icon.png" class="social-icon" />
          </a>
          <a
            href="https://www.facebook.com/GameHavenSTG/"
            class="icon-link"
            target="_blank"
            rel="noopener noreferrer"
            title="https://www.facebook.com/GameHavenSTG/"
          >
            <img src="images/facebook.png" class="social-icon" />
          </a>
        </div>
      </div>
      <!-- Directives are also a huge part of vue, such as the built-in directives including v-if, v-for, v-bind, v-on and v-slot. -->
    </div>
  </body>
  <!-- scripts to connect to vue and connect app.js -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="app.js"></script>
</html>
